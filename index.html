<!DOCTYPE html><html lang="pl">
    <head>
      <meta charset="UTF-8">
        <title>Codzienne Bingo Samochodowe</title>
          <style>
              body {
                    font-family: sans-serif;
                          text-align: center;
                                padding: 20px;
                                    }
                                        .grid {
                                              display: grid;
                                                    grid-template-columns: repeat(5, 1fr);
                                                          gap: 10px;
                                                                max-width: 500px;
                                                                      margin: 20px auto;
                                                                          }
                                                                              .cell {
                                                                                    padding: 20px;
                                                                                          background-color: #eee;
                                                                                                border: 1px solid #aaa;
                                                                                                      cursor: pointer;
                                                                                                            user-select: none;
                                                                                                                }
                                                                                                                    .cell.selected {
                                                                                                                          background-color: #87d487;
                                                                                                                                text-decoration: line-through;
                                                                                                                                    }
                                                                                                                                      </style>
                                                                                                                                      </head>
                                                                                                                                      <body>
                                                                                                                                        <h1>Codzienne Bingo Samochodowe</h1>
                                                                                                                                          <div id="grid" class="grid"></div>  <script>
                                                                                                                                              // Lista modeli samochodów (przykładowa)
                                                                                                                                                  const cars = [
                                                                                                                                                        "Audi A4", "BMW 3", "Mercedes C", "Fiat Panda", "Toyota Corolla",
                                                                                                                                                              "Skoda Octavia", "Honda Civic", "Ford Focus", "VW Golf", "Opel Astra",
                                                                                                                                                                    "Peugeot 308", "Renault Megane", "Citroen C4", "Kia Ceed", "Hyundai i30",
                                                                                                                                                                          "Mazda 3", "Volvo S60", "Seat Leon", "Tesla Model 3", "Nissan Qashqai",
                                                                                                                                                                                "Suzuki Swift", "Dacia Duster", "Lexus IS", "Jaguar XE", "Alfa Romeo Giulia",
                                                                                                                                                                                      "Mini Cooper", "Chevrolet Cruze", "Chrysler 200", "Subaru Impreza", "Jeep Renegade"
                                                                                                                                                                                          ];

                                                                                                                                                                                              const gridEl = document.getElementById("grid");
                                                                                                                                                                                                  const todayKey = new Date().toISOString().split("T")[0];
                                                                                                                                                                                                      const boardKey = `bingo_board_${todayKey}`;
                                                                                                                                                                                                          const stateKey = `bingo_state_${todayKey}`;

                                                                                                                                                                                                              // Tworzy losową planszę 5x5 z 25 unikalnymi indeksami
                                                                                                                                                                                                                  function generateBoard() {
                                                                                                                                                                                                                        const indices = Array.from({ length: cars.length }, (_, i) => i);
                                                                                                                                                                                                                              for (let i = indices.length - 1; i > 0; i--) {
                                                                                                                                                                                                                                      const j = Math.floor(Math.random() * (i + 1));
                                                                                                                                                                                                                                              [indices[i], indices[j]] = [indices[j], indices[i]];
                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                          return indices.slice(0, 25);
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                  // Zapis do ciasteczek
                                                                                                                                                                                                                                                                      function setCookie(name, value) {
                                                                                                                                                                                                                                                                            document.cookie = `${name}=${value}; path=/; expires=${new Date(Date.now() + 86400000).toUTCString()}`;
                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                    // Odczyt z ciasteczek
                                                                                                                                                                                                                                                                                        function getCookie(name) {
                                                                                                                                                                                                                                                                                              const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
                                                                                                                                                                                                                                                                                                    return match ? match[2] : null;
                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                            // Renderuje planszę
                                                                                                                                                                                                                                                                                                                function renderBoard(board, state) {
                                                                                                                                                                                                                                                                                                                      gridEl.innerHTML = "";
                                                                                                                                                                                                                                                                                                                            for (let i = 0; i < 25; i++) {
                                                                                                                                                                                                                                                                                                                                    const carName = cars[board[i]];
                                                                                                                                                                                                                                                                                                                                            const cell = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                    cell.className = "cell";
                                                                                                                                                                                                                                                                                                                                                            if (state[i] === '1') cell.classList.add("selected");
                                                                                                                                                                                                                                                                                                                                                                    cell.textContent = carName;
                                                                                                                                                                                                                                                                                                                                                                            cell.addEventListener("click", () => {
                                                                                                                                                                                                                                                                                                                                                                                      cell.classList.toggle("selected");
                                                                                                                                                                                                                                                                                                                                                                                                const updated = Array.from(gridEl.children).map(el => el.classList.contains("selected") ? "1" : "0").join("");
                                                                                                                                                                                                                                                                                                                                                                                                          setCookie(stateKey, updated);
                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                          gridEl.appendChild(cell);
                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                        // Inicjalizacja
                                                                                                                                                                                                                                                                                                                                                                                                                                            let board = getCookie(boardKey);
                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!board) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                      const newBoard = generateBoard();
                                                                                                                                                                                                                                                                                                                                                                                                                                                            board = newBoard.join(",");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  setCookie(boardKey, board);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const boardArr = board.split(",").map(x => parseInt(x));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let state = getCookie(stateKey);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!state || state.length !== 25) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        state = "0".repeat(25);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              setCookie(stateKey, state);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      renderBoard(boardArr, state);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
